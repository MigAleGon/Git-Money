<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Money</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="btn-container">
            <button
                id="btn-ingreso" 
                class="def-btn green"
                type="button" 
                aria-label="Añadir ingreso" 
            >+</button>
            <button 
                id="btn-gasto" 
                class="def-btn red" 
                type="button" 
                aria-label="Añadir gasto"
            >-</button>
    </div>
    
    <header>
        <div class="column-1">
            <div class="menu">
                <img src="img/menu.png" alt="Menu Icon" class="menu-icon">
            </div>
            <h1>Vista General</h1>
        </div>
        <div class="column-2">
            <div class="user-info">
                <img src="img/user.png" alt="User Icon" class="user-icon">
                <span>Pajero67</span>
            </div>
        </div>
    </header>

    <main>
        <section class="def-section resumen-section">
            <h3>Resumen</h3>
            <div class="def-div resumen-div">
                <span>Balance: </span>
                <span class="positive">0,00€</span>
            </div>
            <div class="def-div resumen-div">
                <span>Tarjetas de crédito:</span>
                <span class="negative">0,00€</span>
            </div>

            <hr class="divider">

            <div class="def-div resumen-div total">
                <span></span>
                <span class="positive">0,00€</span>
            </div>
        </section>

        <section class="def-section">
            <h3>Default</h3>
            <div class="def-div"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Git Money. Todos los derechos reservados.</p>
        <p>Sitio web realizado por Perchis Inc.</p>
    </footer>

    <dialog id="dialogo-movimiento" arial-labellebdy="titulo-movimiento">
        <h2 id="titulo-movimiento">Añadir ingreso</h2>

        <form id="formulario-movimiento">
            <p>
                <label for="concepto">Concepto:</label>
                <input
                    id="concepto"
                    name="concepto"
                    type="text"
                    required
                >
            </p>

            <p>
                <label for="importe">Importe (€):</label>
                <input
                    id="importe"
                    name="importe"
                    type="number"
                    min="0.01"
                    step="0.01"
                    required
                >
            </p>

            <p>
                <label for="categoria-movimiento">Categoría:</label>
                <select id="categoria-movimiento" name="categoria" required>
                    <option value="">Selecciona una categoría</option>
                    <option value="nomina">Nómina</option>
                    <option value="venta">Venta</option>
                    <option value="otros">Otros</option>
                </select>
            </p>

            <p>
                <label for="fecha">Fecha:</label>
                <input id="fecha" name="fecha" type="date" required>
            </p>

            <p>
                <label for="hora">Hora:</label>
                <input id="hora" name="hora" type="time" required>
            </p>

            <p>
                <label for="notas">Notas (opcional)</label>
                <input id="notas" name="notas" rows="3">
            </p>
            
            <div class="botones-movimiento">
                <button id="btn-cerrar" type="button">Cancelar</button>
                <button id="btn-guardar" type="submit">Guardar</button>
            </div>
        </form>
    </dialog>

    <script src="js/script.js"></script>
</body>
</html>
