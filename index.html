<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Money</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="column-1">
            <div class="menu">
                <img src="img/menu.png" alt="Menu Icon" class="menu-icon">
            </div>
            <h1>Vista General</h1>
        </div>
        <div class="column-2">
            <div class="user-info">
                <img src="img/user.png" alt="User Icon" class="user-icon">
            </div>
            <div class="help-button">
                <img src="img/help.png" alt="Help Icon" class="help-icon">
            </div>
        </div>
    </header>

    <main>
        <section class="resumen-section">
                <h3>Resumen</h3>
            <div class="resumen-div">
                <span>Balance: </span>
                <span>0,00€</span>
            </div>
            <div class="resumen-div">
                <span>Tarjetas de crédito:</span>
                <span>0,00€</span>
            </div>

            <hr class="divider">

            <div class="resumen-div total">
                <span></span>
                <span>0,00€</span>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Git Money. Todos los derechos reservados.</p>
        <p>Sitio web realizado por Perchis Inc.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
