
name: Preparar despliegue Git Money

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar sintaxis PHP
        run: |
          find php -type f -name "*.php" -exec php -l {} \;

      - name: Comprobar sintaxis JavaScript
        run: |
          find js -type f -name "*.js" -exec node --check {} \;

      - name: Crear paquete de Git Money
        run: |
          zip -r git-money.zip index.html css js img php

      - name: Guardar paquete
        uses: actions/upload-artifact@v4
        with:
          name: git-money
          path: git-money.zip
          retention-days: 7
          if-no-files-found: error
